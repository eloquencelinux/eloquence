set default=0
set timeout=5

insmod all_video
insmod gfxterm
insmod png

set gfxmode=auto
terminal_output gfxterm

# Search for the live ISO filesystem partition
search --no-floppy --set=root --file /live/filesystem.squashfs

if [ -s /boot/grub/splash.png ]; then
    background_image /boot/grub/splash.png
elif [ -s /splash.png ]; then
    background_image /splash.png
fi

set menu_color_normal=white/black
set menu_color_highlight=cyan/dark-gray
set color_normal=white/black
set color_highlight=cyan/dark-gray

# Dynamically locate kernel binary regardless of kernel version or architecture suffix
for k in /live/vmlinuz /live/vmlinuz-* /live/linux* /live/Image* /live/vmlinux*; do
    if [ -f "$k" ]; then
        set kernel_path="$k"
        break
    fi
done
if [ -z "$kernel_path" ]; then
    set kernel_path="/live/vmlinuz"
fi

# Dynamically locate initrd image
for i in /live/initrd.img /live/initrd.img-* /live/initrd* /live/initramfs*; do
    if [ -f "$i" ]; then
        set initrd_path="$i"
        break
    fi
done
if [ -z "$initrd_path" ]; then
    set initrd_path="/live/initrd.img"
fi

menuentry "⚡ 1. Eloquence GNU/Linux (Live Desktop Session)" {
    linux $kernel_path boot=live components quiet splash live-config.username=eloquence live-config.user-default-groups=sudo,video,audio,netdev,nopasswdlogin
    initrd $initrd_path
}

menuentry "💿 2. Install Eloquence GNU/Linux (Direct Calamares GUI Installer)" {
    linux $kernel_path boot=live components quiet splash live-config.username=eloquence live-config.user-default-groups=sudo,video,audio,netdev,nopasswdlogin eloquence.autostart=calamares
    initrd $initrd_path
}

menuentry "🛡️ 3. Eloquence GNU/Linux (Fail-safe / Safe Graphics Mode)" {
    linux $kernel_path boot=live components nomodeset noapic noapm nodma nopcmcia nosmp nomce live-config.username=eloquence
    initrd $initrd_path
}

menuentry "⚡ 4. Eloquence GNU/Linux (Copy to RAM Mode)" {
    linux $kernel_path boot=live components toram quiet splash live-config.username=eloquence
    initrd $initrd_path
}
