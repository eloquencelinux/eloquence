set default=0
set timeout=5

# Graphical mode and splash image
insmod all_video
insmod gfxterm
insmod png

set gfxmode=auto
terminal_output gfxterm

if [ -s /boot/grub/splash.png ]; then
    background_image /boot/grub/splash.png
elif [ -s /splash.png ]; then
    background_image /splash.png
fi

set menu_color_normal=white/black
set menu_color_highlight=cyan/dark-gray
set color_normal=white/black
set color_highlight=cyan/dark-gray

menuentry "⚡ 1. Eloquence GNU/Linux 2026.1 (Live Desktop Session)" {
    linux /live/vmlinuz boot=live components quiet splash live-config.username=eloquence live-config.user-default-groups=sudo,video,audio,netdev,nopasswdlogin
    initrd /live/initrd.img
}

menuentry "💿 2. Install Eloquence GNU/Linux (Direct Calamares GUI Installer)" {
    linux /live/vmlinuz boot=live components quiet splash live-config.username=eloquence live-config.user-default-groups=sudo,video,audio,netdev,nopasswdlogin eloquence.autostart=calamares
    initrd /live/initrd.img
}

menuentry "🛡️ 3. Eloquence GNU/Linux (Fail-safe / Safe Graphics Mode)" {
    linux /live/vmlinuz boot=live components nomodeset noapic noapm nodma nopcmcia nosmp nomce live-config.username=eloquence
    initrd /live/initrd.img
}

menuentry "⚡ 4. Eloquence GNU/Linux (Copy to RAM Mode)" {
    linux /live/vmlinuz boot=live components toram quiet splash live-config.username=eloquence
    initrd /live/initrd.img
}
