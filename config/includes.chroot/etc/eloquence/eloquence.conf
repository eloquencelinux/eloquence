# Eloquence OS System Configuration File
[system]
os_name = "Eloquence OS"
distribution_codename = "trixie"
architectures = "amd64, arm64"
default_desktop = "KDE Plasma Wayland / Cinnamon Desktop"

[desktop_environments]
supported = "kde-plasma, cinnamon"

[suite]
theme = "dark"
accent_color = "#3aafa9"
background_color = "#17252a"
autostart_vms = false
default_iso_path = "/var/lib/eloquence/isos"

[installer]
installer_engine = "Calamares"
config_path = "/etc/calamares"

[updates]
apt_repository = "http://deb.eloquencelinux.org/eloquence"
auto_check_updates = true
