name: Eloquence Linux CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run syntax checks
        run: |
          echo "Checking Bash script syntax..."
          bash -n scripts/*.sh 2>/dev/null || echo "No bash scripts to check or skipped."

  build-matrix:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64
          - arch: arm64
            target: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Build Script for ${{ matrix.arch }}
        run: |
          echo "Starting build process for target architecture: ${{ matrix.target }}"
          chmod +x scripts/build-iso.sh
          ./scripts/build-iso.sh ${{ matrix.target }}
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eloquence-iso-${{ matrix.arch }}
          path: build_output/*.iso
