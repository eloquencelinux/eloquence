name: CI & Quality Control

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine psutil build setuptools

      - name: Run Python Code Validation
        run: |
          make test

      - name: Run Shell Script Linters
        run: |
          make lint

      - name: Build Python Package (Wheel & Source)
        run: |
          python -m build

      - name: Test Live ISO Script Workflow
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh amd64
          ./scripts/build.sh arm64
