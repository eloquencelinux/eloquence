name: CI - Code Quality & Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-test-and-lint:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine psutil build setuptools

      - name: Validate Python Modules Syntax (make test)
        run: |
          make test

      - name: Validate Shell Scripts Syntax (make lint)
        run: |
          make lint

      - name: Test Python Wheel Packaging
        run: |
          python -m build --wheel --no-isolation

  iso-pipeline-test:
    name: Multi-Arch ISO Pipeline Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Build Scripts Execution
        run: |
          chmod +x scripts/build.sh auto/config.sh auto/build.sh
          ./scripts/build.sh amd64
          ./scripts/build.sh arm64
