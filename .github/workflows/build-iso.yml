name: Build Eloquence GNU/Linux Live ISOs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-iso-x64:
    name: Build x86_64 Live ISO
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools python3 python3-pip

      - name: Run Test Suite
        run: |
          make test
          make lint

      - name: Build x86_64 Live ISO
        run: |
          sudo make build-iso-x64

      - name: Upload x86_64 ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eloquence-amd64-iso
          path: build_output/eloquence-amd64.iso
