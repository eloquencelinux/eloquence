[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eloquence-suite"
version = "0.1.0"
description = "Ecosistemul utilitarelor Elo-Suite pentru Eloquence Run"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4.0",
    "psutil>=5.9.0"
]

[project.scripts]
elovirt = "elovirt.main:main"
